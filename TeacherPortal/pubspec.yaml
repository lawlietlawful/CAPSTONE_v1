name: teacher_portal
description: "Misamis University Teacher Portal – Quick behavioral-incident logging for advisers/professors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP client
  http: ^1.2.0
  # State management
  provider: ^6.1.2
  # Local storage
  shared_preferences: ^2.2.2
  # Fonts
  google_fonts: ^6.2.1
  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
