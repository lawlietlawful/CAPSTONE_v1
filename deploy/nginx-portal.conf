# One address for the whole system:
#   /           Laravel — admin and counselor web pages, and the mobile API (/api)
#   /teacher/   Teacher Portal (Flutter web build)
#   /student/   Student Portal (Flutter web build)
#
# Install: sudo cp deploy/nginx-portal.conf /etc/nginx/sites-available/referral
#          (replace portal.your-school.edu.ph and the php-fpm socket version)
#          sudo ln -s /etc/nginx/sites-available/referral /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d portal.your-school.edu.ph

server {
    listen 80;
    server_name portal.your-school.edu.ph;

    root /var/www/referral/student-referral-system/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;   # admin CSV imports

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Flutter portals (static files) ──
    location ^~ /teacher/ {
        root /var/www/portals;
        try_files $uri $uri/ /teacher/index.html;
    }
    location ^~ /student/ {
        root /var/www/portals;
        try_files $uri $uri/ /student/index.html;
    }
    # Always fetch a fresh app shell, so users get new releases right away.
    location ~ ^/(teacher|student)/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        root /var/www/portals;
        add_header Cache-Control "no-cache";
    }

    # ── Laravel ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (.env, .git) or backups.
    location ~ /\.(?!well-known) { deny all; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
