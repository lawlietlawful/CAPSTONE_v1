name: student_portal
description: "Misamis University Student Portal – Automated Student Referral and Predictive Intervention Analytics"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP client
  http: ^1.2.0
  # State management
  provider: ^6.1.2
  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  # Fonts
  google_fonts: ^6.2.1
  # Date formatting
  intl: ^0.19.0
  # Shimmer loading effect
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
